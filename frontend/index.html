<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conciliação de Parcelas</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="background-blob"></div>
    <div class="background-blob blob-2"></div>

    <div class="app-container glass">
        <header>
            <div class="header-content">
                <div>
                    <h1>Conciliação de Parcelas</h1>
                    <p class="subtitle">Gerencie suas pendências de forma bonitinha!</p>
                </div>
                <div class="header-actions">
                    <div id="status-indicator" class="status-indicator hidden" onclick="app.openStatusModal()">
                        <span class="pulse"></span>
                        <span id="status-text">Processando...</span>
                    </div>
                    <button id="btn-logout" class="btn-logout hidden" onclick="app.logout()">Sair</button>
                </div>
            </div>
        </header>

        <div id="app-notification" class="app-notification hidden" role="status" aria-live="polite"></div>

        <main id="main-content">
            <!-- Views will be injected here -->
        </main>
    </div>

    <!-- Templates -->
    <template id="view-login">
        <div class="login-view glass">
            <form class="login-form" onsubmit="event.preventDefault(); app.login();">
                <h2>Login</h2>
                <p>Acesse o painel administrativo</p>
                <div class="input-group">
                    <label>Usuário</label>
                    <input type="text" id="login-user" placeholder="Digite seu usuário" class="glass-input">
                </div>
                <div class="input-group">
                    <label>Senha</label>
                    <input type="password" id="login-pass" placeholder="Digite sua senha" class="glass-input">
                </div>
                <button type="submit" class="btn-login">Entrar</button>
            </form>
        </div>
    </template>

    <!-- Layout de abas full-screen: Conciliação + Importação (issue #6) -->
    <template id="view-tabs">
        <div class="tabs-view">
            <!-- Barra de importação: configurações + processar -->
            <div class="import-bar">
                <span class="import-bar-label">Importar</span>
                <button type="button" class="setting-chip" onclick="app.toggleImportPopover()">📅 <span id="chip-date">–</span></button>
                <div class="bar-sep"></div>
                <button type="button" class="setting-chip" onclick="app.toggleImportPopover()">🚫 <span id="chip-excl">–</span></button>
                <div class="bar-spacer"></div>
                <button id="btn-process" class="btn-process" onclick="app.startTransactionProcessing()">
                    <span class="icon">⚡</span> Processar Transações
                </button>
                <div class="import-popover" id="import-popover">
                    <div class="pop-title">Configurações de importação</div>
                    <div class="pop-field">
                        <label for="opt-start-date">Data inicial da busca</label>
                        <input type="date" class="pop-date" id="opt-start-date">
                        <small id="opt-start-date-error" class="option-error hidden"></small>
                    </div>
                    <div class="pop-field">
                        <label>Categorias a excluir</label>
                        <div class="pop-checks">
                            <label class="pop-check"><input type="checkbox" id="opt-exclude-same-person" value="Same person transfer"> Same person transfer</label>
                            <label class="pop-check"><input type="checkbox" id="opt-exclude-credit-card" value="Credit card payment"> Credit card payment</label>
                        </div>
                    </div>
                    <p id="execution-options-summary" class="execution-options-summary"></p>
                    <div class="pop-actions">
                        <button type="button" class="btn btn-ghost" id="btn-options-reset">Restaurar padrão</button>
                        <button type="button" class="btn btn-accept" onclick="app.closeImportPopover()">Fechar</button>
                    </div>
                </div>
            </div>

            <!-- Navegação das abas -->
            <div class="tabs-nav">
                <button type="button" class="tab-btn active" id="tab-btn-conc" onclick="app.switchTab('conc')">
                    Conciliação
                    <span class="tab-count cnt-conc" id="cnt-conc">0</span>
                </button>
                <button type="button" class="tab-btn" id="tab-btn-imp" onclick="app.switchTab('imp')">
                    Importação
                    <span class="tab-count cnt-imp" id="cnt-imp">0</span>
                </button>
            </div>

            <!-- Barra de seleção em lote (Conciliação) -->
            <div class="batch-bar" id="batch-bar">
                <div class="chk" id="batch-chk-all" onclick="app.toggleConcAll()"></div>
                <span class="batch-label">
                    <strong id="conc-sel-count">0</strong> de <strong id="conc-total">0</strong> selecionadas
                </span>
                <div class="batch-actions">
                    <button type="button" class="btn btn-concil" id="btn-concil-lote" disabled onclick="app.acceptSelectedConciliations()">Conciliar lote</button>
                    <button type="button" class="btn btn-reject" id="btn-reject-lote" disabled onclick="app.rejectSelectedConciliations()">Rejeitar lote</button>
                </div>
            </div>

            <!-- Corpo rolável das abas -->
            <div class="tabs-scroll">
                <div class="tab-panel active" id="tab-conc">
                    <div class="tab-body" id="conc-body"></div>
                </div>
                <div class="tab-panel" id="tab-imp">
                    <div class="tab-body" id="imp-body"></div>
                </div>
            </div>

            <!-- Barra de ação flutuante (Importação) -->
            <div class="action-bar off" id="imp-action-bar">
                <span class="action-label" id="imp-sel-lbl">0 selecionadas</span>
                <button type="button" class="btn btn-copy-sel" id="imp-copy-btn" onclick="app.copySelectedImport()">Copiar 0</button>
                <button type="button" class="btn btn-ghost" onclick="app.clearImportSelection()">Limpar</button>
            </div>
        </div>
    </template>

    <!-- Modal de Status -->
    <div id="status-modal-container"></div>
    <template id="modal-execution-status">
        <div class="modal-overlay">
            <div class="modal-content glass">
                <div class="modal-header">
                    <h2>Status da Execução</h2>
                    <button class="btn-close" onclick="app.closeStatusModal()">×</button>
                </div>
                <div class="modal-body">
                    <div class="execution-info">
                        <div class="status-badge" id="execution-status">RUNNING</div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="progress-fill"></div>
                            <span class="progress-text" id="progress-text">0%</span>
                        </div>
                        <div class="current-step" id="current-step">FETCHING_TRANSACTIONS</div>
                    </div>

                    <div class="metrics-grid">
                        <div class="metric-card">
                            <span class="metric-label">Transações Buscadas</span>
                            <span class="metric-value" id="metric-transactions">-</span>
                        </div>
                        <div class="metric-card">
                            <span class="metric-label">Parcelas Criadas</span>
                            <span class="metric-value" id="metric-installments">-</span>
                        </div>
                        <div class="metric-card">
                            <span class="metric-label">Duplicatas Removidas</span>
                            <span class="metric-value" id="metric-duplicates">-</span>
                        </div>
                    </div>

                    <div class="execution-history">
                        <h3>Histórico de Execuções</h3>
                        <div id="history-list" class="history-list">
                            <!-- Items will be injected here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <script type="module" src="app.js"></script>
</body>

</html>
